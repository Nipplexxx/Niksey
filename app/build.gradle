plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.niksey'
    compileSdk = 36
    viewBinding.enabled = true

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        applicationId "com.example.niksey"
        minSdk 24
        targetSdk = 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // MaterialDrawer
    implementation "com.mikepenz:materialdrawer:6.1.2"

    // AndroidX
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation "androidx.annotation:annotation:1.10.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"

    // Firebase — только через BOM
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0'
    implementation 'com.google.firebase:firebase-storage-ktx:21.0.2'
    implementation 'com.google.firebase:firebase-auth-ktx:23.2.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'com.google.android.gms:play-services-auth:21.5.1'

    // Остальные библиотеки
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.firebaseui:firebase-ui-database:9.1.1'
    implementation 'com.fredporciuncula:phonemoji:1.5.2'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    kapt 'com.github.bumptech.glide:compiler:5.0.7'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Новые правильные артефакты (замена старых)
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
    implementation 'io.github.chaosleung:pinview:1.4.4'

    // Тесты
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2")
}